<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="64" height="64">
  <title>Element ID</title>
  <!-- 单元杆件 (蓝色) -->
  <line x1="4" y1="30" x2="32" y2="6" stroke="#003399" stroke-width="2.0" stroke-linecap="round" />
  
  <!-- 统一的ID标签 (居中放置，样式与Node ID完全一致) -->
  <rect x="10" y="12" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#FF0000" stroke-width="1.5" />
  <!-- 文字: ID -->
  <text x="18" y="21.5" text-anchor="middle" fill="#FF0000" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="9px" stroke="none">ID</text>
</svg>
