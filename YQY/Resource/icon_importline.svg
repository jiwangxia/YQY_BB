<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="64" height="64">
  <title>Quick Assembly</title>
  <!-- 左侧塔 (Blue) -->
  <line x1="8" y1="30" x2="8" y2="12" stroke="#003399" stroke-width="2.0" stroke-linecap="round" />
  <!-- 横担大幅加长，从(4,16)到(12,16) 改为 (2,16)到(14,16) -->
  <line x1="2" y1="16" x2="14" y2="16" stroke="#003399" stroke-width="2.0" stroke-linecap="round" />
  
  <!-- 右侧塔 (Blue) -->
  <line x1="28" y1="30" x2="28" y2="12" stroke="#003399" stroke-width="2.0" stroke-linecap="round" />
  <!-- 横担大幅加长，从(24,16)到(32,16) 改为 (22,16)到(34,16) -->
  <line x1="22" y1="16" x2="34" y2="16" stroke="#003399" stroke-width="2.0" stroke-linecap="round" />
  
  <!-- 自动生成的导线 (Red) -->
  <path d="M8,16 Q18,25 28,16" fill="none" stroke="#FF0000" stroke-width="2.0" />
  
  <!-- 智能生成/魔法星标 (Red) -->
  <path d="M18,5 L19.5,9.5 L24,11 L19.5,12.5 L18,17 L16.5,12.5 L12,11 L16.5,9.5 Z" fill="#FF0000" stroke="none" />
</svg>
