<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="64" height="64">
  <title>Element Axis</title>
  <!-- 左节点 (蓝色) -->
  <circle cx="6" cy="30" r="2.5" fill="#003399" stroke="none" />
  <!-- 右节点 (蓝色) -->
  <circle cx="30" cy="6" r="2.5" fill="#003399" stroke="none" />
  
  <!-- 轴线 (红色) - 缩短一点点以露出节点 -->
  <line x1="9" y1="27" x2="27" y2="9" stroke="#FF0000" stroke-width="2.5" stroke-linecap="round" />
</svg>
