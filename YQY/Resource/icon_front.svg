<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="64" height="64">
  <title>Front View (XOZ)</title>
  <g fill="#003399" stroke="#003399" stroke-width="2.5" stroke-linecap="round" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11px">
    <!-- X轴 (向右) -->
    <line x1="6" y1="30" x2="18" y2="30" />
    <polygon points="25,30 18,27 18,33" stroke="none" />
    <text x="27" y="33" stroke="none" text-anchor="start" fill="#FF0000">X</text>
    <!-- Z轴 (向上) -->
    <line x1="6" y1="30" x2="6" y2="18" />
    <polygon points="6,11 3,18 9,18" stroke="none" />
    <text x="6" y="8" stroke="none" text-anchor="middle" fill="#FF0000">Z</text>
  </g>
</svg>
