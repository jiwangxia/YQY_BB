<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="64" height="64">
  <title>Node ID</title>
  <!-- 背景结构：线框模式 -->
  <path d="M4,32 L18,18 L32,32" fill="none" stroke="#003399" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 蓝色实心球 -->
  <circle cx="18" cy="18" r="5" fill="#003399" stroke="#FFFFFF" stroke-width="1.5" />
  
  <!-- 悬浮的ID标签 (位于顶部) -->
  <rect x="10" y="0.5" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#FF0000" stroke-width="1.5" />
  
  <!-- 文字: ID -->
  <text x="18" y="9.5" text-anchor="middle" fill="#FF0000" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="9px" stroke="none">ID</text>
</svg>
