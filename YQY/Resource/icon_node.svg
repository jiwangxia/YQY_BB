  <path d="M4,4 L32,32" stroke="#003399" stroke-width="2.0" stroke-linecap="round" />
  <path d="M4,32 L32,4" stroke="#003399" stroke-width="2.0" stroke-linecap="round" />
  
  <!-- 核心节点：红色实心球，带白边以从背景中跳脱出来 -->
